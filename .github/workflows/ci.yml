name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branding check runs `git grep` and `git ls-files` over the
          # tracked set, so it needs real history rather than a blob-less
          # checkout. fetch-depth 1 is enough: it searches the checked-out
          # commit, not the log.
          fetch-depth: 1

      # Read the toolchain from the module itself, so the two can never drift
      # apart -- the same pin the sibling repo uses for its Go sidecar.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # One script, so what CI runs and what a contributor can run locally
      # cannot drift apart. It is also each step as its own statement, because
      # `set -e` does not abort inside an `&&` chain -- which is how a commit
      # lands with vet red.
      - name: Check
        run: ./scripts/check.sh

      # The chart's real gate. `internal/repocheck` checks what can be checked
      # without Helm -- that it parses, that its two versions are separate
      # fields, that the three refusals are still in the templates -- and this
      # is the half that needs the binary: a template that does not render is
      # a release that fails at `helm install`, on somebody else's cluster.
      #
      # Rendered with the values a real deployment uses, not with defaults:
      # defaults have no domain, and the chart correctly refuses those.
      - name: Helm chart
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/helm/addy --set domain=relay.example
          helm template addy deploy/helm/addy \
            --set domain=relay.example \
            --set turn.enabled=true \
            --set turn.publicIP=203.0.113.10 \
            --set portal.enabled=true > /dev/null
          # And that the refusals actually refuse. A guard rail nothing tests
          # is a guard rail somebody deletes during a refactor.
          ! helm template addy deploy/helm/addy > /dev/null 2>&1
          ! helm template addy deploy/helm/addy --set domain=relay.example --set turn.enabled=true > /dev/null 2>&1
          ! helm template addy deploy/helm/addy --set domain=relay.example --set turn.enabled=true \
              --set turn.publicIP=203.0.113.10 --set turn.minPort=51000 > /dev/null 2>&1

      # The reason this is here rather than "nice to have later": the HPKE
      # library carries GO-2026-4550 / CVE-2026-1229 below v1.6.3. A pin that
      # drifts under it is a silent downgrade of the one primitive the whole
      # product's confidentiality claim rests on, and nothing else in the
      # pipeline would notice.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Cross-compile every published target, not just this runner's. A target
      # that only breaks on another GOOS is otherwise discovered by the release
      # workflow, at which point the tag already exists.
      - name: Cross-compile
        run: bash scripts/build.sh

      # The build script claims byte-reproducibility, which is what makes the
      # SHA-256 table in the release notes worth printing. An unverified claim
      # about reproducibility is worse than none, so CI runs it twice and
      # compares.
      - name: Reproducible
        run: |
          cp dist/SHA256SUMS /tmp/sums-first
          bash scripts/build.sh >/dev/null
          if ! diff -u /tmp/sums-first dist/SHA256SUMS; then
            echo "::error::two builds of the same commit produced different binaries"
            exit 1
          fi

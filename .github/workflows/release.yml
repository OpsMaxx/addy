# Release discipline inherited from the OpsMaxx repo at the first tag, rather
# than rediscovered after the first bad release.
#
# A security product whose own binaries ship unsigned, unscanned and without
# reproducible checksums undercuts the entire pitch, and the cheapest moment to
# get that right is before anyone has downloaded anything.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  # Not cancel-in-progress: re-pushing a tag would otherwise leave two jobs
  # editing the same release body.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check the tag matches the version the binary reports
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ADDY_VERSION="$tag" bash scripts/build.sh linux-amd64 >/dev/null 2>&1 \
                  && ./dist/addy_${tag}_linux_amd64 version 2>/dev/null | awk '{print $2}' || true)
          if [ "$built" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME would produce a binary reporting '$built'"
            exit 1
          fi

      - name: Build every target
        run: ADDY_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build.sh

      # The reproducibility claim is what makes the checksum table worth
      # printing. An unverified claim about reproducibility is worse than not
      # making one.
      - name: Check the build is reproducible
        run: |
          cp dist/SHA256SUMS /tmp/first
          ADDY_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build.sh >/dev/null
          if ! diff -u /tmp/first dist/SHA256SUMS; then
            echo "::error::two builds of the same commit produced different binaries"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters: a large share of cheap VPS capacity is arm, and the
          # compose file is the supported way to run this.
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/opsmaxx/addy:${{ github.ref_name }}
            ghcr.io/opsmaxx/addy:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_SHA=${{ github.sha }}

  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Scan the binaries with ClamAV
        id: clamav
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav
          # A failed signature update is a warning: it means the scan is less
          # good, not that the binaries are bad.
          sudo freshclam --quiet || echo "::warning::freshclam could not update signatures"
          set +e
          clamscan --recursive --infected --no-summary --max-filesize=1024M --max-scansize=1024M dist/
          code=$?
          set -e
          case "$code" in
            0) echo "clean" ;;
            1) echo "::error::ClamAV found something in the release artifacts"; exit 1 ;;
            *) echo "::warning::ClamAV could not complete (exit $code)" ;;
          esac

      # ClamAV needs no account so it always runs and can fail the build.
      # VirusTotal needs a key, so it is skipped rather than failed when one is
      # not configured -- a fork must still be able to cut a release.
      - name: Scan with VirusTotal
        id: virustotal
        if: env.VT_API_KEY != ''
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/addy_*

      - name: Build the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "## Install"
            echo
            echo '```'
            echo "curl -fsSL https://get.opsmaxx.dev/addy/install.sh | sh -s -- --domain addy.example.com"
            echo '```'
            echo
            echo "The installer refuses rather than half-installing: it checks DNS from a"
            echo "public resolver and proves port 80 is reachable with a real staging"
            echo "certificate order before it writes anything."
            echo
            echo "## Container"
            echo
            echo '```'
            echo "ghcr.io/opsmaxx/addy:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "## Downloads"
            echo
            echo "| File | Platform |"
            echo "|---|---|"
            for f in dist/addy_*; do
              n=$(basename "$f")
              case "$n" in
                *linux_amd64)   p="Linux x86-64" ;;
                *linux_arm64)   p="Linux arm64" ;;
                *darwin_amd64)  p="macOS Intel" ;;
                *darwin_arm64)  p="macOS Apple silicon" ;;
                *windows_amd64.exe) p="Windows x86-64" ;;
                SHA256SUMS)     continue ;;
                *)              p="-" ;;
              esac
              echo "| [\`$n\`]($BASE/$n) | $p |"
            done
            echo
            echo "## Checksums"
            echo
            echo "Reproducible: CI builds every target twice and fails if the bytes differ."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            awk '{ printf "| `%s` | `%s` |\n", $2, $1 }' dist/SHA256SUMS
          } > release-notes.md
          cat release-notes.md

      - name: Publish as a draft
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          # Draft first. The next step checks what actually landed and only
          # then makes it visible, so a release with a broken notes body is
          # never public.
          draft: true

      - name: Verify the published notes, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body -q .body > remote.md
          missing=0
          while read -r sum name; do
            grep -q "$sum" remote.md || { echo "::error::checksum for $name is missing from the notes"; missing=1; }
            grep -q "$name" remote.md || { echo "::error::$name is missing from the notes"; missing=1; }
          done < dist/SHA256SUMS
          [ "$missing" -eq 0 ] || exit 1

          # Only now make it visible. A prerelease (a tag with a hyphen in it)
          # must not become "latest".
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false ;;
            *)   gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac

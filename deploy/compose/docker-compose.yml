# addy on one box.
#
# install.sh writes .env next to this file and never edits this file.
#
# GARAGE IS GONE. Earlier versions of this file ran a Garage S3 node for blobs,
# and nothing ever read it: objects live in SQLite and the ADDY_S3_* settings
# were never wired into the binary. It cost the installer a 2 GiB / 2 vCPU /
# 20 GiB floor and three secrets for a service with no client.

services:
  addy:
    image: ghcr.io/opsmaxx/addy:${ADDY_VERSION:-latest}
    container_name: addy
    restart: unless-stopped
    # HOST NETWORKING, for three independent reasons, any one sufficient:
    #
    # 1. The UDP relay range. Publishing a range with -p costs a docker-proxy
    #    process and a NAT rule PER PORT. The design's literal 49152-65535 is
    #    16384 ports; it does not merely start slowly, it wedges the daemon.
    # 2. TURN needs the real client source address. With the userland proxy
    #    enabled -- the default on many installs -- published UDP arrives from
    #    the proxy, so every client appears to come from one address and
    #    permissions and channel binding cannot work.
    # 3. IPv6. The default bridge is IPv4-only unless enable_ipv6 and ip6tables
    #    are set in daemon.json. An AAAA record this box cannot serve is one of
    #    the more expensive ways to fail an ACME order.
    network_mode: host
    command: ["serve", "-ui"]
    environment:
      ADDY_DOMAIN: ${ADDY_DOMAIN:?run install.sh}
      ADDY_ACME_EMAIL: ${ADDY_ACME_EMAIL:-}
      ADDY_DATA_DIR: /var/lib/addy
      ADDY_TURN_SECRET: ${ADDY_TURN_SECRET:?run install.sh}
      # The relay runs only when it knows the address to advertise, and
      # install.sh writes the IPv4 it detected. Empty means no relay. The
      # relay range is the binary's, 61000-65535/udp, plus 3478/udp: there is
      # no setting for it, so the firewall advice and the process cannot
      # disagree. See internal/relay for why it starts at 61000.
      ADDY_TURN_PUBLIC_IP: ${ADDY_TURN_PUBLIC_IP:-}
      # The operator console. All three or none -- addy refuses to start with
      # some of them -- and docs/OPERATOR-SIGNIN.md is how to get the values.
      # Set them in .env, never here.
      ADDY_OIDC_ISSUER: ${ADDY_OIDC_ISSUER:-}
      ADDY_OIDC_CLIENT_ID: ${ADDY_OIDC_CLIENT_ID:-}
      ADDY_OIDC_CLIENT_SECRET: ${ADDY_OIDC_CLIENT_SECRET:-}
      ADDY_SIGNUP: ${ADDY_SIGNUP:-}
    volumes:
      # SQLite, certmagic's storage, and the PEM exported for other services.
      - addy-state:/var/lib/addy
    healthcheck:
      # Loopback, naming the domain. Without -connect the probe resolved the
      # domain through public DNS and so depended on the provider routing the
      # box's own public address back to it, which many do not.
      test: ["CMD", "/addy", "selftest", "-quick", "-connect", "127.0.0.1:443"]
      interval: 30s
      timeout: 20s
      retries: 3
      # First boot includes a real ACME order, which is not fast and must not
      # be read as a failing container.
      start_period: 90s

volumes:
  addy-state:

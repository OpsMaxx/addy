# addy + Garage on one box.
#
# install.sh writes .env next to this file and never edits this file.
#
# WHAT BREAKS IF THIS IS WRONG
#
# - Garage's image is FROM scratch. It has no shell and no curl, so a
#   healthcheck written as CMD-SHELL or as a curl invocation fails with an exec
#   error that surfaces only as "unhealthy" -- and the operator then spends an
#   hour debugging a cluster that is fine. `/garage health -q` in exec form is
#   the only shape that works.
# - Garage refuses to start if a secret FILE is group- or world-readable. Every
#   secret here arrives by environment from .env (mode 0600) rather than as a
#   file, which sidesteps that check. If you switch to the *_file variants, the
#   0600 becomes yours to maintain.
# - addy is host-networked, so it is NOT on the compose bridge and CANNOT
#   resolve `garage` by service name. It reaches it at 127.0.0.1:3900.

services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: addy-garage
    restart: unless-stopped
    # --single-node builds and applies a one-node layout on first start, and
    # does nothing on every start after that. --default-bucket creates the
    # bucket and re-grants the default key read+write+owner on every boot.
    # Both are idempotent upstream, which is why the installer does not
    # orchestrate a layout-assign/layout-apply sequence at all.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?run install.sh}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?run install.sh}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-addy}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run install.sh}
    ports:
      # Loopback only, and only the two an operator needs from the host: 3900
      # so `aws s3` works for debugging, 3903 for the admin API. 3901 (RPC) and
      # 3902 (web) are not published at all.
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # `garage health` exits non-zero while the cluster cannot serve. Before
      # the layout is applied there are no storage nodes, so this stays red
      # until the bootstrap has actually finished -- which is what makes
      # depends_on below mean "can take a PUT" rather than "the process
      # started".
      test: ["CMD", "/garage", "health", "-q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  addy:
    image: ghcr.io/opsmaxx/addy:${ADDY_VERSION:-latest}
    container_name: addy
    restart: unless-stopped
    # HOST NETWORKING, for three independent reasons, any one sufficient:
    #
    # 1. The UDP relay range. Publishing a range with -p costs a docker-proxy
    #    process and a NAT rule PER PORT. The design's literal 49152-65535 is
    #    16384 ports; it does not merely start slowly, it wedges the daemon.
    # 2. TURN needs the real client source address. With the userland proxy
    #    enabled -- the default on many installs -- published UDP arrives from
    #    the proxy, so every client appears to come from one address and
    #    permissions and channel binding cannot work.
    # 3. IPv6. The default bridge is IPv4-only unless enable_ipv6 and ip6tables
    #    are set in daemon.json. An AAAA record this box cannot serve is one of
    #    the more expensive ways to fail an ACME order.
    network_mode: host
    command: ["serve", "-ui"]
    environment:
      ADDY_DOMAIN: ${ADDY_DOMAIN:?run install.sh}
      ADDY_ACME_EMAIL: ${ADDY_ACME_EMAIL:-}
      ADDY_DATA_DIR: /var/lib/addy
      ADDY_S3_ENDPOINT: http://127.0.0.1:3900
      ADDY_S3_REGION: garage
      ADDY_S3_BUCKET: ${GARAGE_DEFAULT_BUCKET:-addy}
      ADDY_S3_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      ADDY_S3_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      ADDY_TURN_SECRET: ${ADDY_TURN_SECRET:?run install.sh}
      # Narrowed from the 49152-65535 the design names. Two reasons, held in
      # one place: WireGuard's 51820 sits inside that range and the collision
      # is intermittent and start-order-dependent, which is the worst kind to
      # debug; and 200 concurrent relayed sessions is far past what a
      # single-box relay will ever see, while every firewall rule and provider
      # firewall form scales with the number of ports.
      ADDY_TURN_RELAY_MIN: ${ADDY_TURN_RELAY_MIN:-49160}
      ADDY_TURN_RELAY_MAX: ${ADDY_TURN_RELAY_MAX:-49360}
    volumes:
      # SQLite, certmagic's storage, and the PEM exported for other services.
      - addy-state:/var/lib/addy
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/addy", "selftest", "-quick"]
      interval: 30s
      timeout: 20s
      retries: 3
      # First boot includes a real ACME order, which is not fast and must not
      # be read as a failing container.
      start_period: 90s

volumes:
  garage-meta:
  garage-data:
  addy-state:

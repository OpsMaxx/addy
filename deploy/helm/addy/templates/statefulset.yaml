{{- include "addy.validate" . -}}
# A StatefulSet, not a Deployment, and the reason is not the name.
#
# addy holds an ACME account key, issued certificates and a SQLite database in
# one volume. Two replicas sharing that volume corrupt the database; two
# replicas with separate volumes are two relays with two rosters and one
# hostname, which is worse. A StatefulSet with one replica says "this is a
# single thing with an identity" rather than leaving somebody to discover it by
# scaling up.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "addy.fullname" . }}
  labels: {{- include "addy.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "addy.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "addy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "addy.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: addy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - -domain={{ .Values.domain }}
            {{- if .Values.acmeEmail }}
            - -email={{ .Values.acmeEmail }}
            {{- end }}
            {{- if .Values.portal.enabled }}
            - -ui
            {{- end }}
            {{- if .Values.turn.enabled }}
            - -turn-public-ip={{ .Values.turn.publicIP }}
            - -turn-port={{ .Values.turn.port }}
            {{- end }}
          env:
            - name: ADDY_DATA_DIR
              value: /var/lib/addy
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            {{- if .Values.turn.enabled }}
            - name: turn
              containerPort: {{ .Values.turn.port }}
              protocol: UDP
            {{- end }}
          # `selftest -quick`, which checks the instance ANSWERS OVER ITS OWN
          # TLS rather than that the process is up. A relay that is running and
          # cannot serve is the worst first impression the product can make,
          # and "the container is running" is exactly the evidence that
          # produces it.
          livenessProbe:
            exec:
              command: ["/addy", "selftest", "-quick", "-target", "localhost:443"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["/addy", "selftest", "-quick", "-target", "localhost:443"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              {{- if or (eq (int .Values.service.httpPort) 80) (eq (int .Values.service.httpsPort) 443) }}
              # 80 and 443 are privileged, and the pod runs as non-root.
              # NET_BIND_SERVICE is the narrow capability for exactly that, and
              # it is the only one added -- dropping ALL and adding one back is
              # a smaller grant than not dropping.
              add: ["NET_BIND_SERVICE"]
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/addy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

apiVersion: v2
name: addy
description: A self-hosted, end-to-end-encrypted satellite relay for OpsMaxx
type: application
# The chart's own version. Bumped when the TEMPLATES change, which is not the
# same event as a new addy release -- appVersion tracks that, and conflating
# the two means a chart fix cannot ship without pretending to be a new server.
version: 0.1.2
appVersion: "0.1.2"
home: https://github.com/OpsMaxx/addy
sources:
  - https://github.com/OpsMaxx/addy
# NO `icon:`, and `helm lint` says INFO about it on every run.
#
# The field takes a URL, and the only honest values are a link to a file this
# repository does not have or a data URI for an icon nobody has drawn. A dead
# link in a chart somebody installs is worse than a hint in a linter nobody
# reads, and an INFO is not a failure -- the chart lints with zero failures
# either way.
keywords:
  - sync
  - end-to-end-encryption
  - relay

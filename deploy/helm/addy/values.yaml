# addy on Kubernetes. The same binary as the compose deployment; what differs
# is everything around it.
#
# READ THIS BEFORE YOU DEPLOY
#
# addy terminates TLS ITSELF and routes by SNI. That is not a preference: it is
# how four things share port 443 on one box -- the portal, the API, and the
# services it proxies or passes through. Putting an ingress controller in front
# of it undoes that, because the controller terminates TLS and addy then sees
# one hostname for everything.
#
# So this chart defaults to a LoadBalancer Service carrying 80 and 443 straight
# to the pod, and there is no ingress template. If your cluster cannot give you
# that, the honest answer is that addy wants a box more than it wants a
# cluster, and compose is a better fit than a chart that quietly gives up the
# routing.

image:
  repository: ghcr.io/opsmaxx/addy
  # Pinned rather than `latest`. A relay that changes version because a node
  # rescheduled is one whose behaviour nobody can reason about. Empty means
  # the chart's appVersion. Images are tagged WITHOUT the git tag's `v` --
  # `0.1.0`, not `v0.1.0` -- the same string `addy version` prints.
  tag: ""
  pullPolicy: IfNotPresent

# The hostname devices reach. Required: addy refuses to serve a name it was not
# configured for, which is what stops it answering for somebody else's.
domain: ""

# Contact address for the ACME account, so the CA can warn before a renewal
# fails.
acmeEmail: ""

service:
  type: LoadBalancer
  # 80 must be reachable from the internet or ACME HTTP-01 cannot complete --
  # not "should be", cannot. The preflight says so and so does this.
  httpPort: 80
  httpsPort: 443
  annotations: {}

# The embedded TURN relay.
#
# Off unless you give it a public IP. TURN puts that address in the protocol
# and cannot infer it behind NAT or behind a Service, so a relay that guesses
# allocates addresses nobody can reach -- and fails only under the NAT
# conditions it exists for.
#
# The Service carries `port` and NOT the relay range, 61000-65535/udp, which
# is fixed in the binary (internal/relay). A relayed session's packets arrive
# on a port from that range at publicIP, so they have to reach this pod there:
# a node with that public address and the range open to it, which a
# LoadBalancer does not arrange. This used to offer range values that nothing
# passed to addy.
#
# So turn.enabled REQUIRES turn.hostNetwork, and the chart refuses one without
# the other. hostNetwork puts the pod on its node's own network: the relay
# range and 3478 are then the node's ports, and publicIP must be that node's
# public address -- pin the pod to it with nodeSelector. 80 and 443 become the
# node's too, so nothing else on that node may hold them.
turn:
  enabled: false
  publicIP: ""
  port: 3478
  hostNetwork: false

# The operator console at /admin. All three or none: addy refuses to start
# with some of them. The client secret comes from a Secret you create, never
# from values -- values end up in the release history in plain text.
#
#   kubectl create secret generic addy-oidc --from-literal=client-secret=...
#
# docs/OPERATOR-SIGNIN.md is how to get the issuer, id and secret.
oidc:
  issuer: ""
  clientID: ""
  clientSecretName: ""     # a Secret with a `client-secret` key
  # Who may sign in besides you: invite (default), open or closed.
  signup: ""

portal:
  enabled: false

persistence:
  # The database, the certificate store and the ACME account key. Losing this
  # means every device re-onboards and every certificate is reissued.
  enabled: true
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

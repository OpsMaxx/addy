# WireGuard.
# Written by `addy service install wireguard` at ${GENERATED_AT}.
#
# WHAT BREAKS IF THIS IS WRONG
#
# - NET_ADMIN and a sysctl are both required. Without the capability the
#   container starts and cannot create the interface; without the sysctl it
#   creates it and forwards nothing, which looks like a client problem.
# - ${WG_PORT} must not be inside addy's TURN relay range. The default relay
#   range starts at 52000 precisely so that 51820 is below it.

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20250521
    container_name: addy-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    environment:
      SERVERURL: "${DOMAIN}"
      SERVERPORT: "${WG_PORT}"
      INTERNAL_SUBNET: "${WG_SUBNET}"
      PEERS: "1"
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules:ro

volumes:
  wireguard-config:

# Vaultwarden, behind addy's front door.
# Written by `addy service install vaultwarden` at ${GENERATED_AT}.
#
# READ THIS BEFORE YOU RUN IT
#
# addy's design is a relay that holds nothing worth attacking. This is a
# password database. Running both here means one compromise reaches both, and
# an attacker on this box can serve modified JavaScript to the web vault --
# at which point they are not attacking the encryption at all. On a personal
# box that may be a fine trade. It should be a trade you made on purpose.
#
# WHAT BREAKS IF THIS IS WRONG
#
# - Loopback only. addy terminates TLS on 443 and proxies here. Publishing 8222
#   puts the vault on the public interface beside the thing meant to be in
#   front of it.
# - WebSockets are needed for live sync and arrive on the same port in current
#   versions; a front door that does not upgrade them leaves clients polling.

services:
  vaultwarden:
    image: vaultwarden/server:1.34.1-alpine
    container_name: addy-vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8222:80"
    environment:
      DOMAIN: "https://${DOMAIN}"
      SIGNUPS_ALLOWED: "${VW_SIGNUPS}"
      # Blank disables the admin page entirely, which is the better answer
      # unless you need it today. An admin token on a public host is a second
      # password protecting everything the first one protects.
      ADMIN_TOKEN: "${VW_ADMIN_TOKEN}"
      ROCKET_PORT: "80"
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/alive"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vaultwarden-data:
